title: Computational Essays
author: <a href="https://www.geschichte.hu-berlin.de/de/bereiche-und-lehrstuehle/digital-history">Digital History, Humboldt-Universität zu Berlin</a>
copyright: "2024"
language: de
logo: img/Logo_DigitalHistoryBerlin.png

url: https://digital-history-berlin.github.io/
baseurl: /computational-essays

# Files that are not part of the book. Setting this replaces Jupyter Book's
# defaults, so they are repeated here before the local virtual environments
exclude_patterns:
  - _build
  - Thumbs.db
  - .DS_Store
  - "**.ipynb_checkpoints"
  - .venv
  - venv
  # Repository files that are linked from the README, not pages of the book
  - LICENSE.md
  # Files created when the Word conversion example is run locally
  - "Konvertierungen/Sample_*"

# HTML-specific settings
html:
  comments:
    hypothesis: true
  extra_navbar: |
    <div>
    Veröffentlicht durch Digital History Lehrstuhl, Humboldt-Universität zu Berlin
    </div>
  extra_footer: |
    <div>
    <a href="https://creativecommons.org/licenses/by/4.0/deed.de"><img class="license" alt="Creative Commons License" src="https://i.creativecommons.org/l/by/4.0/80x15.png" /></a> Texte und Abbildungen dieses Buchs stehen unter der Lizenz <a href="https://creativecommons.org/licenses/by/4.0/deed.de">CC BY 4.0</a>, Code unter der MIT-Lizenz (<a href="https://github.com/Digital-History-Berlin/Computational-Essays/blob/main/LICENSE.md">Details</a>).
    </div>

# Execution settings
execute:
  execute_notebooks: auto
  timeout: 300
  allow_errors: false
  # The Word conversion notebook needs pandoc and writes files next to
  # itself, so it is shown with its stored outputs instead of being run
  exclude_patterns:
    - "Konvertierungen/*"

# LaTeX settings
latex:
  latex_documents:
    targetname: book.tex

# Launch button settings
launch_buttons:
  notebook_interface: jupyterlab
  thebe: true
  colab: false
  binderhub_url: ""

parse:
  myst_enable_extensions:
    # These are the default extensions
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    # smartquotes is left out on purpose: Sphinx already sets quotation
    # marks according to the book language (German), MyST would use English ones
    - substitution
 
# Search settings
sphinx:
  config:
    html_show_copyright: false
    language: de
    # Only link real URLs, not file names such as README.md
    myst_linkify_fuzzy_links: false
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/mermaid/9.1.3/mermaid.min.js